name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Pandoc
      uses: r-lib/actions/setup-pandoc@v2
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Build site with pandoc
      run: |
        # Build the main README.md with pandoc
        pandoc --toc -s README.md --template template.html -o index.html
        
        # Create public directory for GitHub Pages deployment
        mkdir -p public
        
        # Copy all necessary files to public directory
        # Main site files
        cp -r README.html index.html template.html libs/ public/
        
        # Copy lectures
        cp -r Lectures/* public/Lectures/
        
        # Copy tutorials
        cp -r Tutorials/* public/Tutorials/
        
        # Copy homeworks
        cp -r Homework/* public/Homework/
        
        # Copy exercises
        cp -r Exercices/* public/Exercices/
        
        # Copy quiz materials
        cp -r Quiz/* public/Quiz/
        
        # Copy other important files
        cp -r *.md *.csv *.Rproj public/
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public