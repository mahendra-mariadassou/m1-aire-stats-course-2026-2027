name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Pandoc
      uses: r-lib/actions/setup-pandoc@v2
      
    - name: Build site
      run: |
        # Build the main README.md with pandoc
        pandoc --toc -s README.md --template template.html -o index.html
        
        # Copy all files to public directory for GitHub Pages
        mkdir -p public
        cp -r * public/
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public