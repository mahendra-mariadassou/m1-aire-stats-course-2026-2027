name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Pandoc
      uses: r-lib/actions/setup-pandoc@v2
      
    - name: Build site
      run: |
        # Build the main README.md with pandoc to generate index.html
        pandoc --toc -s README.md --template template.html -o index.html
        
        # Create public directory for GitHub Pages deployment
        mkdir -p public
        
        # Copy all necessary files to public directory
        # Core site files
        cp README.html index.html template.html libs/ public/
        
        # Course materials - copy all directories that contain generated HTML files
        cp -r Lectures/ public/
        cp -r Tutorials/ public/
        cp -r Homework/ public/
        cp -r Exercices/ public/
        cp -r Quiz/ public/
        
        # Other important files
        cp -r *.md *.csv *.Rproj public/
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public